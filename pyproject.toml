[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-calculator"
version = "1.0.0"
description = "Production financial calculator and interactive Streamlit web application."
readme = "README.md"
authors = [
    { name = "Raiyan Mahmud", email = "raiyanmahmud484@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.36.0,<2.0.0",
    "plotly>=5.20.0,<8.0.0",
    "pandas>=2.0.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "*.ipynb",
    ".git",
    "__pycache__",
    ".venv",
    ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
